# Site settings
title: "小白的工程实践与思考档案"
email:
description: >-
  一个记录个人作品、学习复盘与思考档案的中文网站，关注机器人、嵌入式控制、
  YOLO 目标检测、Linux 和软件工程。
url: "https://bloodest761-ship-it.github.io"
baseurl: ""
repository: "bloodest761-ship-it/bloodest761-ship-it.github.io"
locale: "zh-CN"
timezone: "Asia/Shanghai"

github_username: bloodest761-ship-it
minimal_mistakes_skin: default
search: true
search_full_content: true

# Build settings
markdown: kramdown
remote_theme: "mmistakes/minimal-mistakes"

# Outputting
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Plugins supported by GitHub Pages and Minimal Mistakes.
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache

author:
  name: "小白"
  avatar:
  bio: "正在学习机器人、嵌入式、人工智能与软件工程的本科生。"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/bloodest761-ship-it"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/bloodest761-ship-it"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: true
      toc: true
      toc_sticky: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
      toc: true
      toc_sticky: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
